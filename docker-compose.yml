services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tube_forge
      POSTGRES_USER: tube_forge
      POSTGRES_PASSWORD: change-me
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
